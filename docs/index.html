<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG-Agent 演示站 · 企业级 RAG 知识库智能体平台</title>
<meta name="description" content="RAG-Agent 可交互演示站：智能问答、混合检索调试台、智能体与工作流、客服工单、组织权限，全部数据为本地模拟样本。">
<meta name="theme-color" content="#2B5CE6">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">跳到主要内容</a>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-brand">
      <span class="mark" aria-hidden="true">R</span>
      <span class="side-title"><strong>企业 RAG 知识库</strong><small>演示站 · 本地模拟数据</small></span>
    </div>
    <nav class="menu" id="menu" aria-label="功能导航"></nav>
    <div class="side-foot">
      <button class="collapse-btn" id="collapseBtn" type="button">收起侧边栏</button>
      <div class="ver">v1.0.1 <button type="button" id="updateBtn">检查更新</button></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="hamb" id="hamb" type="button" aria-label="打开导航">☰</button>
      <div class="crumb" id="crumb">工作台</div>
      <div class="top-actions">
        <button class="icon-btn" id="bellBtn" type="button" aria-label="通知">🔔<span class="badge">3</span></button>
        <span class="who"><span class="avatar" aria-hidden="true">管</span>系统管理员</span>
      </div>
    </header>

    <div class="news-bar" id="newsBar" role="button" tabindex="0" aria-label="展开更新日志">
      <span class="news-tag">更新</span>
      <span class="news-text">v1.0.1 应用内更新支持桌面版 / Docker / 源码三种形态 · 工作流新增并行网关与汇聚节点 · 图文知识库命中后自动回传附件</span>
      <span class="news-more">展开 ▾</span>
    </div>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div id="layer"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script src="js/chat.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
