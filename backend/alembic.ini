# Alembic configuration.
#
# NOTE: this file must stay ASCII-only on Windows (alembic reads it with the
# locale encoding). Chinese notes live in alembic/env.py and app/core/migrations.py.
#
# The database URL is NOT stored here: alembic/env.py reads it from
# app.core.config.settings, so migrations always target the database the
# application actually uses.
#
# Common commands (run inside backend/):
#     python -m alembic upgrade head
#     python -m alembic current
#     python -m alembic revision --autogenerate -m "message"
#
# The service runs "upgrade head" automatically on startup
# (see app/core/migrations.py); the CLI is for authoring and troubleshooting.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Timestamped filenames avoid revision-filename collisions between branches.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
